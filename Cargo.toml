[package]
name = "anubis"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
futures-core = "0.3.34"
grammers-client = "0.10.0"
grammers-mtsender = "0.10.0"
grammers-session = { version = "0.10.0", default-features = false, features = ["serde"] }
include_dir = "0.7"
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
md-5 = "0.10"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "cookies", "form", "multipart"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync", "signal", "net", "fs", "io-util", "process"] }
tokio-util = { version = "0.7.19", features = ["io"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# binário final enxuto (roteiro, fase V): otimização entre crates e sem símbolos
[profile.release]
lto = true
codegen-units = 1
strip = true

# librqbit abre sockets em [::] fixo; sem IPv6 no kernel (ipv6.disable=1, caso
# do FeuVault) isso falha. A cópia em vendor/ cai para 0.0.0.0 nesse caso.
[patch.crates-io]
librqbit-dualstack-sockets = { path = "vendor/librqbit-dualstack-sockets" }
