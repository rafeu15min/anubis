[package]
name = "anubis"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "cookies", "form"] }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync", "signal", "net", "fs"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# binário final enxuto (roteiro, fase V): otimização entre crates e sem símbolos
[profile.release]
lto = true
codegen-units = 1
strip = true
