# Anubis — exemplo de configuração. Copie para ~/.config/anubis/anubis.toml
# (chmod 600: tem chaves de API) e preencha. Editar com `vim` via ssh.

[server]
# API HTTP. Um endereço ou vários, do caminho mais rápido ao mais lento: a
# página testa os anteriores ao que está usando e troca para o melhor que o
# aparelho alcança (e o "Abrir no Jellyfin" segue o mesmo caminho).
# Com net.ipv4.ip_nonlocal_bind=1, um endereço ainda sem placa (Tailscale no
# boot) não impede o início.
listen = ["10.10.10.2:7070", "192.168.1.80:7070", "100.121.241.44:7070"]
# rotas POST exigem "Authorization: Bearer <token>"; gere com: openssl rand -hex 24
token = "troque-me"

[storage]
# qualquer caminho dentro do sistema de arquivos vigiado
path = "/mnt/raid0"
# acima de start_percent de uso, apaga os vídeos mais antigos até stop_percent
start_percent = 85.0
stop_percent = 75.0
# nunca apaga o que entrou na biblioteca há menos de N dias
min_age_days = 7
# checagem periódica (além do gatilho de download concluído)
interval_minutes = 30
# true: só registra no log o que apagaria
dry_run = true

# Como cada container enxerga o disco → caminho real no host
[[paths]]  # Sonarr, Radarr e qBittorrent (o Jellyfin tem o dele abaixo)
from = "/data"
to = "/mnt/raid0/anubis"

[sonarr]
url = "http://10.10.10.2:8989"
api_key = ""  # Sonarr → Settings → General → API Key
# pedidos feitos pela busca (caminhos como o Sonarr os enxerga)
quality_profile = "Any"
root_folder = "/data/media/series"
anime_root_folder = "/data/media/animes"

[radarr]
url = "http://10.10.10.2:7878"
api_key = ""
quality_profile = "Any"
root_folder = "/data/media/movies"

[qbittorrent]
url = "http://10.10.10.2:8080"
username = "admin"
# arquivo com a senha da WebUI (uma linha, chmod 600)
password_file = "/home/rafeu/.config/anubis/qbittorrent.pass"

[jellyfin]
url = "http://10.10.10.2:8096"
api_key = ""  # Painel → Chaves de API
# como o Jellyfin enxerga a biblioteca, e onde ela está no host
media_path = "/media"
host_media_path = "/mnt/raid0/anubis/media"
# endereço do Jellyfin nos links abertos no navegador; a página troca o host
# pelo mesmo que ela usa (o Jellyfin precisa escutar nesses endereços também)
public_url = "http://10.10.10.2:8096"

# "Assistir agora": o Anubis baixa com o próprio motor (librqbit) e toca
# enquanto baixa. Sem esta seção, só a busca e os pedidos funcionam.
[stream]
# dentro do mesmo /data do Radarr e do qBittorrent (o import vira hardlink)
download_dir = "/mnt/raid0/anubis/blackhole/completed"
# estado que sobrevive a reinícios (o systemd cria com StateDirectory=anubis)
state_dir = "/var/lib/anubis"

# conversão na hora do que o navegador não toca (H.265, áudio AC3/DTS, MKV)
[stream.transcode]
# usa o ffmpeg do container do Jellyfin (docker exec), sem instalar nada no host
container = "jellyfin"
ffmpeg = "/usr/lib/jellyfin-ffmpeg/ffmpeg"
ffprobe = "/usr/lib/jellyfin-ffmpeg/ffprobe"
encoder = "x264"        # "x264" (CPU) ou "vaapi" (GPU, via device)
device = "/dev/dri/renderD128"
max_height = 720        # altura máxima do vídeo convertido

# links de download apontam para nomes internos do Docker; o host usa o IP
[[stream.url_rewrites]]
from = "http://prowlarr:9696"
to = "http://10.10.10.2:9696"

# Legendas (opcional): a página de Preferências configura o Bazarr por aqui
[bazarr]
url = "http://10.10.10.2:6767"
api_key = ""  # Bazarr → Settings → General → API Key

# "Onde assistir" (opcional): serviços de streaming do país, pelo TMDB
[tmdb]
api_key = ""  # themoviedb.org → Configurações → API: a chave (v3) ou o token de leitura
region = "BR"
