# 2026-10-16: peso de CPU alto (padrão 100). Vale só quando a CPU enche.
# O ffmpeg do player roda no container jellyfin (docker exec), que tem
# cpu_shares 4096 no compose; aqui ficam o servidor que entrega o vídeo ao
# ffmpeg e o "docker exec" que traz a saída dele de volta.
[Service]
CPUWeight=300
