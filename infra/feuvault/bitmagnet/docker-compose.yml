# bitmagnet: escuta a DHT do BitTorrent e cataloga o que circula (inclusive
# dublados que não aparecem em sites); vira mais uma fonte no Prowlarr
# (Torznab em http://bitmagnet:3333/torznab). github.com/bitmagnet-io/bitmagnet
services:
  # painel, Torznab (a busca) e a fila que classifica o que a varredura acha:
  # só lê e escreve no banco, sem tráfego para a internet; sempre ligado
  bitmagnet:
    image: ghcr.io/bitmagnet-io/bitmagnet:latest
    container_name: bitmagnet
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=bitmagnet-postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # chave própria do TMDB (em .env): sem ela, 1 consulta/s para
      # identificar de que filme ou série é cada torrent
      - TMDB_API_KEY=${TMDB_API_KEY}
    volumes:
      - ./config:/root/.config/bitmagnet
    ports:
      # painel e Torznab só no link direto PC <-> FeuVault
      - "10.10.10.2:3333:3333"
    command:
      - worker
      - run
      - --keys=http_server
      - --keys=queue_server
    depends_on:
      bitmagnet-postgres:
        condition: service_healthy
    networks:
      - proxy-network
  # a varredura da DHT: milhares de conversas UDP que lotam a tabela de
  # conexões do roteador/provedor. Quem liga e pausa é o Anubis (só com a
  # casa ociosa: 20 min sem ninguém no site nem assistindo; pausa na hora
  # em que alguém chega) — por isso não reinicia sozinho
  bitmagnet-dht:
    image: ghcr.io/bitmagnet-io/bitmagnet:latest
    container_name: bitmagnet-dht
    restart: "no"
    environment:
      - POSTGRES_HOST=bitmagnet-postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # ritmo da varredura (padrão 10): no 10, metade das conexões do
      # FeuVault para a internet falhava ("host unreachable")
      - DHT_CRAWLER_SCALING_FACTOR=1
    volumes:
      - ./config:/root/.config/bitmagnet
    ports:
      # rede BitTorrent (DHT)
      - "3334:3334/tcp"
      - "3334:3334/udp"
    command:
      - worker
      - run
      - --keys=dht_crawler
    depends_on:
      bitmagnet-postgres:
        condition: service_healthy
    networks:
      - proxy-network
  bitmagnet-postgres:
    image: postgres:16-alpine
    container_name: bitmagnet-postgres
    restart: unless-stopped
    shm_size: 1g
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=bitmagnet
      - PGUSER=postgres
    volumes:
      # no SSD: banco rápido e fora do RAID0 que o Anubis limpa
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      start_period: 20s
      interval: 10s
    networks:
      - proxy-network
networks:
  proxy-network:
    external: true
