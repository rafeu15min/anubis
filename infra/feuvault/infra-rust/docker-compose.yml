services:
  # Prowlarr: O Indexador (Busca os torrents)
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    # API só no link direto PC <-> FeuVault (fora da rede da casa)
    ports:
      - "10.10.10.2:9696:9696"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      # Configs ficam salvas no SSD (alta velocidade/baixa latência)
      - /home/rafeu/infra-rust/config/prowlarr:/config
    restart: unless-stopped
    networks:
      - proxy-network
  # Radarr: Gerente de Filmes
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    # API só no link direto PC <-> FeuVault (fora da rede da casa)
    ports:
      - "10.10.10.2:7878:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      # Banco de dados e configs no SSD
      - /home/rafeu/infra-rust/config/radarr:/config
      # RAID0 inteiro num ponto de montagem só: blackhole e media no mesmo
      # /data → o import vira hardlink (0 bytes a mais), não cópia
      - /mnt/raid0/anubis:/data
    restart: unless-stopped
    networks:
      - proxy-network
  # Sonarr: Gerente de Séries
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    # API só no link direto PC <-> FeuVault (fora da rede da casa)
    ports:
      - "10.10.10.2:8989:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      # Banco de dados e configs no SSD
      - /home/rafeu/infra-rust/config/sonarr:/config
      # RAID0 inteiro num ponto de montagem só: blackhole e media no mesmo
      # /data → o import vira hardlink (0 bytes a mais), não cópia
      - /mnt/raid0/anubis:/data
    restart: unless-stopped
    networks:
      - proxy-network
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=America/Sao_Paulo
    networks:
      - proxy-network
networks:
  proxy-network:
    external: true
