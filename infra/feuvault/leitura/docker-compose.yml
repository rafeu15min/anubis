# Leitura: o ramo *arr dos livros (Bookshelf) e das HQs (Mylar3).
# Mesmo /data do Sonarr/Radarr/qBittorrent: o import vira hardlink e o
# torrent continua semeando. O Anubis copia o arquivo importado para o Drive.
services:
  # Bookshelf: fork vivo do Readarr (metadados do Hardcover)
  bookshelf:
    image: ghcr.io/pennydreadful/bookshelf:hardcover
    container_name: bookshelf
    # API só no link direto PC <-> FeuVault (fora da rede da casa)
    ports:
      - "10.10.10.2:8787:8787"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /home/rafeu/leitura/config/bookshelf:/config
      - /mnt/raid0/anubis:/data
    restart: unless-stopped
    networks:
      - proxy-network
  # Mylar3: HQs (metadados da ComicVine)
  mylar3:
    image: linuxserver/mylar3:latest  # lscr.io não responde do FeuVault
    container_name: mylar3
    ports:
      - "10.10.10.2:8090:8090"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /home/rafeu/leitura/config/mylar3:/config
      - /mnt/raid0/anubis:/data
    restart: unless-stopped
    networks:
      - proxy-network
networks:
  proxy-network:
    external: true
