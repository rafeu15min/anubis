services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    # API só no link direto PC <-> FeuVault (fora da rede da casa)
    ports:
      - "10.10.10.2:8080:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8080
    volumes:
      - /home/rafeu/media-core/config/qbittorrent:/config
      # mesmo /data do Sonarr/Radarr (hardlinks entre download e biblioteca)
      - /mnt/raid0/anubis:/data
    restart: unless-stopped
    networks:
      - proxy-network
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    # 2026-10-16: peso de CPU alto (cpu.weight ~300; os outros containers
    # ficam em 100). O ffmpeg que o Anubis roda aqui dentro (docker exec)
    # leva vantagem quando a CPU enche; sem disputa, não muda nada.
    cpu_shares: 4096
    # nos três caminhos, do mais rápido ao mais lento: cabo direto com o PC,
    # rede da casa e Tailscale (o Anubis leva o "Abrir no Jellyfin" pelo mesmo
    # caminho da página; ip_nonlocal_bind=1 deixa publicar o IP do Tailscale
    # antes de ele subir no boot)
    ports:
      - "10.10.10.2:8096:8096"
      - "192.168.1.80:8096:8096"
      - "100.121.241.44:8096:8096"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /home/rafeu/media-core/config/jellyfin:/config
      - /mnt/raid0/anubis/media:/media:ro
      # página-ponte do Anubis: "Abrir no Jellyfin" já logado
      - /home/rafeu/media-core/jellyfin-anubis-login.html:/usr/share/jellyfin/web/anubis-login.html:ro
    restart: unless-stopped
    networks:
      - proxy-network
networks:
  proxy-network:
    external: true
