# /etc/NetworkManager/conf.d/interconexao-sem-cabo.conf
# O cabo direto com o PC continua ativo (com 10.10.10.2) mesmo com o PC
# desligado: tudo no FeuVault que usa 10.10.10.2 (Anubis → Radarr/Sonarr…)
# segue funcionando.
[device-interconexao]
match-device=interface-name:enp2s0
ignore-carrier=yes
