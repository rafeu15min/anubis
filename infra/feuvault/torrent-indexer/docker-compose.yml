# Indexa sites brasileiros de torrent (Comando, BluDV, Torrent dos Filmes,
# Starck, Rede Torrent, Vaca Torrent) para o Prowlarr — fonte de versões
# dubladas. github.com/felipemarinho97/torrent-indexer (GPL-3.0)
services:
  torrent-indexer:
    image: felipemarinho97/torrent-indexer:latest
    container_name: torrent-indexer
    restart: unless-stopped
    # espera o FlareSolverr: se sobe antes dele (boot do servidor), fica sem
    # sessões e Comando/Starck passam a responder só "challenge"
    entrypoint: ["/bin/sh", "-c", "until wget -q -O /dev/null http://flaresolverr:8191/; do sleep 2; done; exec /app/torrent-indexer"]
    environment:
      - LOG_LEVEL=1
      - REDIS_HOST=torrent-indexer-redis
      # o mesmo FlareSolverr que o Prowlarr já usa
      - FLARESOLVERR_ADDRESS=http://flaresolverr:8191
    depends_on:
      - torrent-indexer-redis
    networks:
      - proxy-network
  torrent-indexer-redis:
    image: redis:alpine
    container_name: torrent-indexer-redis
    restart: unless-stopped
    networks:
      - proxy-network
networks:
  proxy-network:
    external: true
