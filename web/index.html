<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anubis · Busca</title>
<style>
  /* sem barras de rolagem: a página e os carrosséis rolam do mesmo jeito */
  * { scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }
  :root {
    --bg: #111016; --panel: #1b1a22; --line: #2c2a36; --text: #ece9f2; --muted: #9a96a8;
    --accent: #c9a24a; --ok: #5fbf7f; --info: #6fa8ff;
  }
  * { box-sizing: border-box; }
  /* ícones: Nerd Font reduzida aos usados (web/icones.py) */
  @font-face { font-family: 'Anubis Icones'; src: url('icones.woff2?v=4') format('woff2'); font-display: block; }
  .i { display: inline-block; font-family: 'Anubis Icones'; font-style: normal; font-weight: normal; line-height: 1; }
  .i-play::before { content: "\f04b"; } .i-x::before { content: "\f00d"; } .i-gear::before { content: "\f013"; } .i-check::before { content: "\f00c"; }
  .i-left::before { content: "\f053"; } .i-right::before { content: "\f054"; }
  .i-up::before { content: "\f164"; } .i-down::before { content: "\f165"; } .i-trash::before { content: "\f1f8"; }
  .i-download::before { content: "\f019"; } .i-book::before { content: "\f02d"; } .i-film::before { content: "\f008"; } .i-bell::before { content: "\f0f3"; } .i-microphone::before { content: "\f130"; }
  .i-s1::before { content: "\f0a9e"; } .i-s2::before { content: "\f0a9f"; } .i-s3::before { content: "\f0aa0"; } .i-s4::before { content: "\f0aa1"; }
  .i-s5::before { content: "\f0aa2"; } .i-s6::before { content: "\f0aa3"; } .i-s7::before { content: "\f0aa4"; } .i-s8::before { content: "\f0aa5"; }
  /* troca Vídeos ↔ Leitura: a página nova entra devagar, a marca fica (web/comum.js) */
  @view-transition { navigation: auto; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .4s; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; padding: 16px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .bar { display: flex; gap: 12px; align-items: center; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0; font-size: 18px; letter-spacing: .08em; color: var(--accent); }
  input[type=search] { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 16px; }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .gear { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 10px; color: var(--muted); font-size: 22px; text-decoration: none; }
  .gear:hover { color: var(--accent); background: var(--panel); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 24px 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
  .card { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .card img, .noposter { width: 92px; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; background: var(--line); }
  .card h3 { margin: 0 0 2px; font-size: 16px; }
  .meta { color: var(--muted); font-size: 13px; }
  .ov { margin: 6px 0; font-size: 13px; color: #c9c5d3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  /* o display dos botões (inline-flex) passaria por cima do atributo hidden */
  [hidden] { display: none !important; }
  button, a.btn { padding: 8px 14px; min-height: 40px; border-radius: 8px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font: inherit; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  button:hover, a.btn:hover { background: color-mix(in srgb, var(--accent) 15%, transparent); }
  button:disabled { opacity: .5; cursor: default; }
  .state { font-size: 13px; color: var(--info); }
  .progress { height: 6px; width: 100%; border-radius: 3px; background: var(--line); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--info); transition: width .6s; }
  /* um selo não quebra no meio: se não cabe, vai inteiro para a linha de baixo */
  .tag { display: inline-block; white-space: nowrap; font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); }
  .tag .i { margin-right: 3px; }
  .tag.seen { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .tag.watching { color: var(--info); border-color: color-mix(in srgb, var(--info) 45%, transparent); }
  button.icon { width: 44px; min-height: 44px; padding: 0; justify-content: center; font-size: 17px; }
  button.icon.on { background: var(--accent); color: #111; }
  button.icon.danger { border-color: color-mix(in srgb, #ff8a8a 60%, transparent); color: #ff8a8a; }
  button.icon.danger:hover { background: color-mix(in srgb, #ff8a8a 15%, transparent); }
  .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  /* baixando: a porcentagem no lugar do ícone */
  button.icon.prog { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--info); border-color: color-mix(in srgb, var(--info) 45%, transparent); }
  /* discreto, entre as etiquetas: sem português → procurar a dublagem agora */
  button.tag.dub { min-height: 0; padding: 1px 7px; font: inherit; font-size: 11px; line-height: inherit; color: #ffb36b; border-color: color-mix(in srgb, #ffb36b 45%, transparent); background: transparent; vertical-align: baseline; }
  button.tag.dub:hover { background: color-mix(in srgb, #ffb36b 12%, transparent); }
  button.tag.dub:disabled { opacity: .8; }
  /* ▶ da série: o episódio que vai tocar escrito ao lado */
  button.primary.next { gap: 8px; padding: 8px 14px; font-variant-numeric: tabular-nums; }
  #itemeps:empty { display: none; }
  #itemeps { margin-top: 10px; }
  .ep small.st { color: var(--info); }
  .tag.none { color: var(--muted); border-style: dashed; }
  summary .tags { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: 1px; }
  #epscheck { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
  /* botão de ícone ocupado: gira no lugar do ícone */
  button.icon.busy { position: relative; }
  button.icon.busy .i { visibility: hidden; }
  button.icon.busy::after { content: ""; position: absolute; width: 16px; height: 16px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: girar .8s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  /* fechar: no canto da janela, à vista mesmo rolando uma lista longa */
  dialog > .x { position: sticky; top: 0; float: right; z-index: 1; width: 40px; height: 40px; min-height: 40px; margin: -8px -8px 0 8px; padding: 0; justify-content: center; border-color: var(--line); border-radius: 50%; background: var(--panel); color: var(--muted); font-size: 16px; }
  #itembody { clear: both; }  /* o cartão começa abaixo do ✕ */
  dialog > .x:hover { border-color: var(--accent); color: var(--accent); background: var(--panel); }
  .msg { color: var(--muted); padding: 24px 0; }
  button.primary { background: var(--accent); color: #111; font-weight: 600; }
  button.quiet { border-color: var(--line); color: var(--muted); }
  button.primary:hover { background: color-mix(in srgb, var(--accent) 85%, white); }
  dialog { max-width: min(720px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 18px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h3 { margin: 0 0 6px; }
  .rel { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .rel b { font-weight: 500; word-break: break-word; }
  .rel small { color: var(--muted); display: block; }
  .rel .why { color: #ffb36b; }
  details { border-top: 1px solid var(--line); padding: 8px 0; }
  summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
  .ep { display: grid; grid-template-columns: 3.2em 1fr auto; gap: 10px; align-items: center; padding: 6px 0; }
  .ep .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .ep .tags { display: inline-flex; flex-wrap: wrap; gap: 4px; vertical-align: 1px; margin-left: 4px; }
  .ep small { color: var(--muted); display: block; }
  .err { color: #ff8a8a; }
  label.rel { cursor: pointer; }
  label.rel input { width: 20px; height: 20px; accent-color: var(--accent); }
  .where { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; padding: 6px 0; }
  .where .prov { display: flex; flex-wrap: wrap; gap: 6px; }
  .where .prov span { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px 3px 3px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  .where img { width: 26px; height: 26px; border-radius: 6px; }
  dialog h4 { margin: 16px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  @media (max-width: 480px) { .card { grid-template-columns: 72px 1fr; } .card img, .noposter { width: 72px; } }
  .tabs { display: flex; gap: 6px; }
  .tabs button { min-height: 40px; padding: 6px 14px; border: 1px solid var(--line); color: var(--muted); }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
  @media (max-width: 700px) { .bar { flex-wrap: wrap; } .tabs { order: 3; width: 100%; } .tabs button { flex: 1; } }
  .shelf h2 { margin-top: 20px; }
  /* setas dos carrosséis: sem barra de rolagem, é por elas que o mouse anda de lado (no toque, arrasta) */
  .railbox { position: relative; }
  .railbox .nav { display: none; position: absolute; top: calc(clamp(112px, 30vw, 150px) * .75 - 22px); z-index: 1; width: 44px; height: 44px; min-height: 0; padding: 0; justify-content: center; border-radius: 50%; border-color: var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent); color: var(--text); font-size: 18px; line-height: 1; }
  .railbox .nav:hover { border-color: var(--accent); color: var(--accent); background: var(--bg); }
  .railbox .nav[data-scroll="-1"] { left: 4px; }
  .railbox .nav[data-scroll="1"] { right: 4px; }
  @media (hover: hover) and (pointer: fine) { .railbox:hover .nav { display: inline-flex; } }
  .rail { display: grid; grid-auto-flow: column; grid-auto-columns: clamp(112px, 30vw, 150px); gap: 12px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 8px; }
  .tile { display: flex; flex-direction: column; align-items: stretch; gap: 4px; min-height: 0; padding: 0; border: 0; background: none; color: inherit; text-align: left; scroll-snap-align: start; }
  .tile:hover { background: none; }
  .tile img, .tile .noposter { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; background: var(--line); }
  .tile:hover img { outline: 2px solid var(--accent); }
  .tile .t { font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .m { font-size: 12px; color: var(--muted); }
  .tile .m .ok { color: var(--ok); }
  .tile .m .sub, .tag.sub { color: #ffb36b; }
  .tag.sub { border-color: #ffb36b; }
  /* sem fonte: apagado (continua clicável) */
  .tile.none img, .tile.none .noposter { opacity: .35; filter: grayscale(1); }
  .tile.none .t { color: var(--muted); }
  .summary { padding: 12px 0 0; }
  .summary b { font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <anubis-marca modo="video"></anubis-marca>
    <nav class="tabs" id="tabs">
      <button data-cat="filmes">Filmes</button><button data-cat="series">Séries</button><button data-cat="animes">Animes</button>
    </nav>
    <input id="q" type="search" placeholder="Buscar filme ou série…" autocomplete="off">
    <a class="gear" href="preferencias" title="Preferências" aria-label="Preferências"><i class="i i-gear"></i></a>
  </div>
</header>
<script src="comum.js"></script>
<main>
  <section id="tracking" hidden>
    <h2>Pedidos em andamento</h2>
    <div class="grid" id="tracked"></div>
  </section>
  <div id="showcase"><p class="msg">Carregando…</p></div>
  <div id="results" hidden></div>
</main>
<dialog id="item">
  <button id="itemclose" class="x" title="Fechar" aria-label="Fechar"><i class="i i-x"></i></button>
  <div id="itembody"></div>
  <div class="row">
    <button id="itemlike" class="icon" title="Gostei (o que se parece com ele aparece mais no Para você)" aria-label="Gostei" aria-pressed="false"><i class="i i-up"></i></button>
    <button id="itemhide" class="icon quiet" title="Não quero ver (sai da vitrine)" aria-label="Não quero ver"><i class="i i-down"></i></button>
  </div>
  <div id="itemeps"></div>
</dialog>
<dialog id="pick">
  <button id="pickclose" class="x" title="Fechar" aria-label="Fechar"><i class="i i-x"></i></button>
  <h3 id="picktitle"></h3>
  <p class="meta" id="pickmsg"></p>
  <p class="meta" id="pickdown" style="color:#ffb36b"></p>
  <div id="rels"></div>
  <div id="pickwhere"></div>
</dialog>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

// escala de caminhos: cabo direto » rede local » Tailscale. O /health lista os
// endereços nessa ordem; os mais rápidos que o atual são testados juntos e a
// página passa para o melhor que responder (uma vez por sessão).
(async () => {
  try { if (sessionStorage.getItem('anubis.caminho')) return; sessionStorage.setItem('anubis.caminho', '1'); } catch {}
  let addrs = [];
  try { addrs = (await (await fetch('health')).json()).addresses || []; } catch { return; }
  const here = addrs.indexOf(location.host);
  const better = here < 0 ? addrs : addrs.slice(0, here);
  const reach = (a) => {
    const ctl = new AbortController();
    setTimeout(() => ctl.abort(), 1500);
    // sem CORS: só interessa se o endereço responde
    return fetch(`http://${a}/health`, { mode: 'no-cors', cache: 'no-store', signal: ctl.signal }).then(() => a);
  };
  const res = await Promise.allSettled(better.map(reach));
  const best = res.find((r) => r.status === 'fulfilled');
  if (best && best.value !== location.host) location.replace(`http://${best.value}${location.pathname}${location.search}${location.hash}`);
})();

// o Jellyfin pelo mesmo caminho desta página (ele escuta nos mesmos endereços)
const jf = (u) => { try { const x = new URL(u); x.hostname = location.hostname; return x.href; } catch { return u; } };

// pedidos acompanhados: ficam no navegador (se ele deixar) para sobreviver a um recarregar
const KEY = 'anubis.pedidos';
let tracked = {};
try { tracked = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(tracked)); } catch {}
  // a lista mudou: a conexão ao vivo passa a cobrir os itens novos
  if (typeof watchLive === 'function') watchLive();
};
const keyOf = (it) => `${it.kind}:${it.id}`;
const lastStatus = {};

const STATE = {
  not_requested: 'Ainda não pedido',
  searching: 'Procurando uma versão compatível…',
  downloading: 'Baixando',
  importing: 'Entrando na biblioteca…',
  available: 'Disponível',
};

// a dublagem automática (ou um pedido avulso pela API) embutindo o áudio PT-BR
const MUX = {
  downloading: 'Dublagem: baixando',
  checking: 'Dublagem: conferindo a sincronia…',
  joining: 'Dublagem: embutindo…',
  importing: 'Dublagem: entrando na biblioteca…',
  done: 'Dublagem embutida',
  failed: 'Não deu para embutir a dublagem',
};
const pct = (p) => `${Math.round(p * 100)}%`;

function muxHtml(m) {
  let txt = MUX[m.step] || m.step;
  if (m.step === 'downloading') txt += m.auto ? ` ${pct(m.audio.progress)}` : ` · vídeo ${pct(m.video.progress)} · dublagem ${pct(m.audio.progress)}`;
  if (m.sync && m.step !== 'failed') {
    // positivo: a dublagem começava atrasada (o Anubis corta esse início)
    txt += Math.abs(m.sync.offset) < 0.05 ? ' · já em sincronia'
      : ` · dublagem ${m.sync.offset > 0 ? 'atrasada' : 'adiantada'} ${Math.abs(m.sync.offset).toFixed(2)} s, corrigida`;
    if (Math.abs(m.sync.speed - 1) > 1e-6) txt += ', velocidade ajustada';
  }
  const done = m.auto ? m.audio.progress : (m.video.progress + m.audio.progress) / 2;
  const bar = m.step === 'downloading' ? `<div class="progress"><i style="width:${(done * 100).toFixed(1)}%"></i></div>` : '';
  const err = m.error ? `<small class="err">${esc(m.error)}</small>` : '';
  return `<span class="state">${txt}</span>${bar}${err}`;
}

// pedido parado em "procurando": o que os indexadores têm e por que foi recusado
function versionsText(v) {
  if (v.approved > 0) return 'Versão aceita encontrada — o download deve começar em instantes';
  if (v.found === 0) return 'Nenhuma versão nos indexadores agora';
  const why = v.reasons.map(([r, n]) => `${n} ${esc(r)}`);
  if (v.no_seeders) why.push(`${v.no_seeders} sem fontes`);
  return `Nenhuma versão aceita: ${v.found} encontradas — ${why.join(', ')}`;
}
function versionsDown(v) {
  const t = versionsText(v);
  return v.approved > 0 || !v.indexers_down?.length ? t : `${t} · fora do ar: ${v.indexers_down.map(esc).join(', ')}`;
}

function statusHtml(st) {
  if (!st) return '';
  if (st.mux && st.mux.step !== 'done') return muxHtml(st.mux);
  if (st.state === 'available') return '';
  let txt = STATE[st.state] || st.state;
  if (st.state === 'searching' && st.versions) txt = versionsDown(st.versions);
  if (st.state === 'downloading' && st.progress != null) txt += ` ${Math.round(st.progress * 100)}%` + (st.eta ? ` · falta ${esc(st.eta)}` : '');
  if (st.episodes) txt += ` · ${st.episodes[0]}/${st.episodes[1]} episódios`;
  const bar = st.progress != null && st.state !== 'available' ? `<div class="progress"><i style="width:${(st.progress * 100).toFixed(1)}%"></i></div>` : '';
  const note = st.note ? `<small class="meta" style="flex-basis:100%">${esc(st.note)}</small>` : '';
  const offer = st.offerSubbed ? `<span class="state" style="flex-basis:100%;color:#ffb36b">Dublagem não encontrada em nenhuma fonte.</span>
    <button data-subbed="${st.offerSubbed}">Instalar legendado</button><small class="meta" style="flex-basis:100%">Baixa a versão legendada agora e troca pela dublada se ela surgir.</small>` : '';
  return `<span class="state">${txt}</span>${bar}${note}${offer}`;
}

// ações em ícone, iguais em filmes, séries e episódios: ▶ sempre; ⬇ no que não
// está no servidor (🔔 se nenhuma fonte tem agora: pede e fica de olho); 🗑 no
// que está; 🎙 discreto: procurar a dublagem agora (no servidor sem português)
const ICON = (cls, attrs, icon, title, inner) =>
  `<button class="icon ${cls}" ${attrs} title="${title}" aria-label="${title}">${inner ?? `<i class="i i-${icon}"></i>`}</button>`;
// 🎙 entre as etiquetas: está no servidor sem português; um toque procura a dublagem
const dubTag = (k, label = 'sem dublagem') =>
  `<button class="tag dub" data-dub="${k}" title="Procurar dublagem agora" aria-label="Sem dublagem: procurar agora"><i class="i i-microphone"></i>${label}</button>`;
// liga ou desliga a etiqueta na linha de etiquetas de um cartão
function setDubTag(cardEl, k, show, label) {
  const row = cardEl && cardEl.querySelector('.row');
  if (!row) return;
  const old = row.querySelector('.tag.dub');
  if (old && !old.disabled) old.remove();
  if (show && !row.querySelector('.tag.dub')) row.insertAdjacentHTML('beforeend', ' ' + dubTag(k, label));
}
function actions(k, o) {
  const st = o.st;
  const btns = [o.play ?? ICON('primary', `data-watch="${k}"`, 'play', 'Assistir')];
  if (o.available) btns.push(ICON('danger', `data-uninstall="${k}"`, 'trash', 'Apagar do servidor'));
  else if (st && st.state === 'downloading') btns.push(ICON('prog', 'disabled', '', 'Baixando', st.progress != null ? `${Math.round(st.progress * 100)}%` : '…'));
  else if (st && st.state === 'importing') btns.push(ICON('busy', 'disabled', 'download', 'Entrando na biblioteca'));
  else if (o.requested || (st && st.state === 'searching')) btns.push(ICON('quiet', 'disabled', 'bell', 'Pedido: baixa quando achar uma versão'));
  else btns.push(o.avail === 'nothing' ? ICON('', `data-req="${k}"`, 'bell', 'Pedir quando aparecer') : ICON('', `data-req="${k}"`, 'download', 'Baixar'));
  if (o.extra) btns.push(o.extra);
  return `<span class="acts" data-acts="${k}">${btns.join('')}</span>`;
}
// as do cartão (filme ou série); na série o ▶ abre a janela com os episódios
// e, nela, vira "▶ T2·E3" (o próximo a assistir)
function cardActions(it, st) {
  const k = keyOf(it);
  const available = st && st.state !== 'not_requested' ? st.state === 'available' || !!it.available : !!it.available;
  const requested = !!(it.requested || tracked[k]) && !available;
  const play = it.kind === 'movie' ? undefined : ICON('primary play-series', `data-open="${k}"`, 'play', 'Episódios');
  return actions(k, { available, avail: it.avail, requested, st, play });
}

function card(it, st) {
  const k = keyOf(it);
  const poster = it.poster ? `<img src="${esc(it.poster)}" alt="" loading="lazy">` : '<div class="noposter"></div>';
  const year = it.year ? ` (${it.year})` : '';
  const tags = [it.kind === 'movie' ? 'filme' : it.anime ? 'anime' : 'série', ...(it.genres || []).slice(0, 2)].map((g) => `<span class="tag">${esc(g)}</span>`).join(' ')
    + (it.avail === 'subbed' ? ' <span class="tag sub" title="Os indexadores só têm no idioma original, com legenda">somente legendado</span>'
      : it.avail === 'nothing' ? ' <span class="tag">sem fonte</span>'
      : it.avail === 'unknown' ? ` <span class="tag">${it.uncertain ? 'não deu para conferir agora — tento de novo em 1 h' : 'conferindo as fontes…'}</span>` : '')
    + (it.available ? ' <span class="tag">na biblioteca</span>' : '');
  const none = it.avail === 'nothing' && !it.requested && !tracked[k] && !it.available;
  const why = none ? `<small class="meta" style="flex-basis:100%">Nenhuma das fontes conferidas tem este título agora. Pedindo (🔔), o ${it.kind === 'movie' ? 'Radarr' : 'Sonarr'} fica de olho e baixa quando ele aparecer.</small>` : '';
  const action = cardActions(it, st);
  return `<article class="card" data-key="${k}">
    ${poster}
    <div>
      <h3>${esc(it.title)}<span class="meta">${year}</span></h3>
      <div class="row">${tags}</div>
      <p class="ov">${esc(it.overview)}</p>
      <div class="row">${action}${why}</div>
      <div class="row status">${statusHtml(st)}</div>
    </div>
  </article>`;
}

let lastResults = {};
async function search(term) {
  const box = $('#results');
  box.innerHTML = '<p class="msg">Buscando…</p>';
  try {
    const r = await fetch(`search?q=${encodeURIComponent(term)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    for (const it of [...d.movies, ...d.series]) lastResults[keyOf(it)] = it;
    const sec = (title, list) => list.length ? `<h2>${title}</h2><div class="grid">${list.map((it) => card(it)).join('')}</div>` : '';
    box.innerHTML = sec('Filmes', d.movies) + sec('Séries', d.series)
      + (d.errors.length ? `<p class="msg err">${d.errors.map(esc).join('<br>')}</p>` : '')
      || '<p class="msg">Nada encontrado.</p>';
    // os já pedidos mostram o estado atual
    for (const it of [...d.movies, ...d.series]) if (it.requested) refresh(it, false);
  } catch (e) {
    box.innerHTML = `<p class="msg err">Falhou: ${esc(e.message)}</p>`;
  }
}

async function request(k) {
  const it = lastResults[k] || tracked[k];
  if (!it) return;
  const btns = document.querySelectorAll(`[data-req="${k}"]`);
  const busy = (on) => btns.forEach((b) => { b.disabled = on; b.classList.toggle('busy', on); });
  busy(true);
  const r = await fetch('request', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: it.kind, id: it.id }) });
  const st = await r.json();
  if (!r.ok) { busy(false); alert(`Não deu para pedir: ${st.error}`); return; }
  // pronto ao terminar: abre o Jellyfin — não numa série que já tinha episódios
  tracked[k] = { ...it, requested: true, openWhenReady: !it.available };
  save();
  render(tracked[k], st);
  if (it.kind === 'series' && openKey === k && $('#item').open) setTimeout(() => { if ($('#item').open && openKey === k) loadEpisodes(it); }, 10000);
}

// "assistir agora": o Anubis escolhe a versão, começa a baixar e abre o player
const size = (b) => (b >= 2 ** 30 ? `${(b / 2 ** 30).toFixed(1).replace('.', ',')} GB` : `${Math.round(b / 2 ** 20)} MB`);
async function watch(k, guid, keep = false) {
  const [kind, id] = [k.split(':')[0], +k.split(':')[1]];
  const btns = document.querySelectorAll(`[data-watch="${k}"]`);
  // botão de texto: a mensagem vai nele; botão de ícone (▶ dos episódios):
  // ele gira e a mensagem aparece embaixo do episódio
  btns.forEach((b) => { b.dataset.html ??= b.innerHTML; });
  const say = (t) => btns.forEach((b) => {
    b.disabled = true;
    if (!b.classList.contains('icon')) { b.textContent = t; return; }
    b.classList.add('busy');
    const row = b.closest('.ep');
    const st = row && (row.querySelector('.st') || row.children[1].appendChild(Object.assign(document.createElement('small'), { className: 'st' })));
    if (st) st.textContent = t;
    const status = !row && b.closest('.card')?.querySelector('.status');
    if (status) status.innerHTML = `<span class="state">${esc(t)}</span>`;
  });
  say('Procurando versão…');
  // a busca passa por todas as fontes; as protegidas pelo Cloudflare levam ~30 s
  const slow = [setTimeout(() => say('Buscando nas fontes…'), 8000), setTimeout(() => say('Ainda buscando (até 1–2 min)…'), 30000)];
  try {
    const r = await fetch('watch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind, id, guid, keep }) });
    const d = await r.json();
    if (r.ok) { location.href = d.player; return; }
    if (r.status === 409 && d.no_approved) {
      const some = d.candidates.length > 0;
      // recusadas só por não serem dubladas: é a hora do legendado
      const onlyDub = some && d.candidates.every((c) => c.reasons.length && c.reasons.every((x) => /Custom Formats/i.test(x)));
      $('#rels').innerHTML = d.candidates.map((c, i) => `<div class="rel">
          <div><b>${esc(c.title)}</b><small>${size(c.size)} · ${c.seeders} fontes${c.playable === 0 ? ' · H.265: talvez não toque no navegador' : ''}</small>
          ${onlyDub ? '' : `<small class="why">${esc(c.reasons.join(' · '))}</small>`}</div>
          <button${onlyDub && i === 0 ? ' class="primary"' : ''} data-watch="${k}" data-guid="${esc(c.guid)}">${onlyDub ? (i === 0 ? 'Assistir legendado' : 'Esta') : 'Assistir esta'}</button></div>`).join('');
      $('#picktitle').textContent = onlyDub ? 'Dublagem não encontrada' : some ? 'Nenhuma versão passa no seu perfil de qualidade' : 'Nenhuma versão disponível';
      // dubladas que existem mas não tinham ninguém compartilhando agora
      const dead = (d.dead || []).length
        ? `${d.dead.length === 1 ? 'A versão dublada encontrada não tem' : `As ${d.dead.length} versões dubladas encontradas não têm`} ninguém compartilhando agora (${d.dead.join('; ')}). `
        : '';
      $('#pickmsg').textContent = dead + (onlyDub
        ? `${dead ? '' : 'Nenhuma fonte tem a versão dublada. '}A primeira é a recomendada; a legenda em português aparece no player se vier no arquivo (as da Amazon costumam trazer).`
        : some
          ? 'Todas as versões encontradas foram recusadas. Você pode assistir uma delas mesmo assim — o perfil não muda.'
          : 'As fontes não têm nenhuma versão com gente compartilhando agora.');
      // fontes fora do ar: a busca pode ter deixado versões de fora
      const down = d.indexers_down || [];
      $('#pickdown').dataset.k = k;
      $('#pickdown').innerHTML = down.length
        ? `Fora do ar agora: <b>${down.map(esc).join(', ')}</b> — a busca pode ter deixado versões de fora. <button data-retest="${down.length}">Testar de novo</button>`
        : '';
      // episódio: o "onde assistir" é da série
      if (kind === 'episode') loadWhere($('#pickwhere'), 'series', currentTvdb);
      else loadWhere($('#pickwhere'), kind, id);
      $('#pick').showModal();
    } else alert(`Não deu para assistir: ${d.error}`);
  } finally {
    slow.forEach(clearTimeout);
    btns.forEach((b) => {
      b.disabled = false;
      b.classList.remove('busy');
      b.innerHTML = b.dataset.html;
      const st = b.closest('.ep') && b.closest('.ep').querySelector('.st');
      if (st) st.remove();
    });
  }
}
$('#pickclose').onclick = () => $('#pick').close();

// testa de novo as fontes fora do ar; alguma voltou: busca de novo
async function retestIndexers(btn) {
  const before = +btn.dataset.retest, k = $('#pickdown').dataset.k;
  btn.disabled = true;
  btn.textContent = 'Testando (até 1–2 min)…';
  try {
    const d = await (await fetch('indexers/test', { method: 'POST' })).json();
    if (d.down.length < before) { $('#pick').close(); watch(k); return; }
    $('#pickdown').innerHTML = `Continuam fora do ar: <b>${d.down.map(esc).join(', ')}</b>.`;
  } catch {
    btn.disabled = false;
    btn.textContent = 'Testar de novo';
  }
}

// onde o título passa oficialmente no Brasil (sem [tmdb] na config, some)
async function loadWhere(el, kind, id) {
  el.innerHTML = '';
  if (!id) return;
  try {
    const r = await fetch(`where/${kind}/${id}`);
    if (!r.ok) return;
    const d = await r.json();
    const rows = d.offers.map((o) => `<small class="meta">${esc(o.kind)}</small><div class="prov">${o.providers.map((p) =>
      `<span>${p.logo ? `<img src="${esc(p.logo)}" alt="">` : ''}${esc(p.name)}</span>`).join('')}</div>`).join('');
    el.innerHTML = `<h4>Onde assistir no Brasil</h4>`
      + (rows ? `<div class="where">${rows}</div>
          <p class="meta">O TMDB não informa o idioma do áudio; nos serviços brasileiros a dublagem costuma estar disponível.
          ${d.link ? `<a href="${esc(d.link)}" target="_blank" rel="noopener">Links para cada serviço</a> · ` : ''}dados do JustWatch via TMDB</p>`
        : '<p class="meta">Não está em nenhum serviço de streaming no Brasil agora.</p>');
  } catch {}
}

// o que o usuário do Jellyfin já viu: assistido, ou parado no meio (a fatia
// do círculo mostra quanto)
function watchTag(w) {
  if (!w) return '';
  if (w.percent) return `<span class="tag watching"><i class="i i-s${Math.min(8, Math.max(1, Math.round(w.percent / 12.5)))}"></i>assistindo ${w.percent}%</span>`;
  return '<span class="tag seen"><i class="i i-check"></i>assistido</span>';
}

// temporadas e episódios de uma série, dentro da própria janela dela
let currentTvdb = null;
// da série aberta: o próximo a assistir, se falta episódio já exibido, se
// algum está sem português (as ações do topo dependem disso)
let seriesInfo = null;
const today = () => new Date().toISOString().slice(0, 10);
function epActions(e) {
  if (e.air_date && e.air_date > today()) return `<span class="meta">estreia ${esc(e.air_date)}</span>`;
  const st = e.downloading != null ? { state: e.downloading >= 1 ? 'importing' : 'downloading', progress: e.downloading } : e.st;
  return actions(`episode:${e.id}`, { available: e.has_file, avail: e.avail, st });
}
function epRow(e) {
  const tags = (e.has_file ? '<span class="tag">na biblioteca</span>' : '') + (e.has_file && e.portuguese === false ? dubTag(`episode:${e.id}`) : '')
    + watchTag(e.watch) + (e.avail && AVAIL_TAG[e.avail] && !e.has_file ? AVAIL_TAG[e.avail] : '');
  return `<div class="ep" data-ep="${e.id}"${e.has_file || (e.air_date && e.air_date > today()) ? ' data-have' : ''}><span class="n">${e.number}</span>
    <div>${esc(e.title || 'Episódio ' + e.number)}${tags ? ` <span class="tags">${tags}</span>` : ''}<small>${esc(e.air_date || '')}</small></div>${epActions(e)}</div>`;
}
// topo da série: ▶ T2·E3 (o próximo não assistido; tudo visto: T1·E1), ⬇ dos
// episódios que faltam, 🗑 da série, 🎙 dos episódios sem português
function seriesActions(it, st) {
  const k = keyOf(it), n = seriesInfo.next;
  const label = n ? `T${n.season}·E${n.number}` : '';
  const play = n
    ? `<button class="primary next" data-watch="episode:${n.id}" title="Assistir ${label}" aria-label="Assistir ${label}"><i class="i i-play"></i>${label}</button>`
    : ICON('primary', 'disabled', 'play', 'Nenhum episódio exibido ainda');
  const available = seriesInfo.have > 0;
  const extra = available && seriesInfo.missing > 0 && !(st && ['downloading', 'importing'].includes(st.state))
    ? ICON('', `data-req="${k}"`, 'download', `Baixar os ${seriesInfo.missing} episódios que faltam`) : '';
  return actions(k, { available, avail: it.avail, requested: !available && !!(it.requested || tracked[k]), st, play, extra });
}
async function loadEpisodes(it) {
  const tvdb = it.id, k = keyOf(it);
  currentTvdb = tvdb;
  const box = $('#itemeps');
  if (!box.children.length) box.innerHTML = '<p class="msg">Carregando episódios…</p>';
  try {
    const r = await fetch(`series/${tvdb}/episodes`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    if (currentTvdb !== tvdb) return;
    const aired = d.seasons.filter((x) => x.number > 0).flatMap((x) => x.episodes.map((e) => ({ ...e, season: x.number }))).filter((e) => !e.air_date || e.air_date <= today());
    const all = d.seasons.flatMap((x) => x.episodes);
    seriesInfo = {
      k,
      next: aired.find((e) => !(e.watch && e.watch.played)) || aired[0],
      have: all.filter((e) => e.has_file).length,
      missing: aired.filter((e) => !e.has_file && e.downloading == null).length,
      noPt: all.filter((e) => e.has_file && e.portuguese === false).length,
    };
    setDubTag($(`#itembody [data-key="${k}"]`), k, seriesInfo.noPt > 0, seriesInfo.noPt === 1 ? '1 episódio sem dublagem' : `${seriesInfo.noPt} episódios sem dublagem`);
    const open = [...box.querySelectorAll('details[open]')].map((x) => x.dataset.season);
    box.innerHTML = d.seasons.map((x, i) => `<details data-season="${x.number}" ${(open.length ? open.includes(String(x.number)) : i === 0) ? 'open' : ''}>
        <summary>${x.number === 0 ? 'Especiais' : `Temporada ${x.number}`} <span class="meta">· ${x.episodes.length} episódios</span><span class="tags"></span></summary>
        ${x.episodes.map(epRow).join('')}</details>`).join('') || '<p class="msg">Nenhum episódio.</p>';
    document.querySelectorAll(`#itembody [data-acts="${k}"]`).forEach((el) => { el.outerHTML = seriesActions(it, lastStatus[k]); });
    episodeAvailability(tvdb);
    // baixando: a lista se atualiza até terminar
    if (d.seasons.some((x) => x.episodes.some((e) => e.downloading != null || e.st))) setTimeout(() => { if (currentTvdb === tvdb && $('#item').open) loadEpisodes(it); }, 10000);
  } catch (e) {
    box.innerHTML = `<p class="msg err">Falhou: ${esc(e.message)}</p>`;
  }
}
// ⬇ de um episódio: a busca do "assistir" escolhe e o Sonarr baixa
async function requestEpisode(b, id) {
  b.disabled = true;
  b.classList.add('busy');
  try {
    const r = await fetch('request', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'episode', id }) });
    const st = await r.json();
    if (!r.ok) throw new Error(st.error);
    const row = b.closest('.ep');
    if (row) row.querySelector('[data-acts]').outerHTML = actions(`episode:${id}`, { available: st.state === 'available', st });
    const it = lastResults[openKey] || tracked[openKey];
    if (it) setTimeout(() => { if ($('#item').open) loadEpisodes(it); }, 10000);
  } catch (e) {
    alert(`Não deu para baixar: ${e.message}`);
    b.disabled = false;
    b.classList.remove('busy');
  }
}
// 🎙 procurar a dublagem agora (filme, episódio ou a série toda)
async function dubNow(b, k) {
  const [kind, id] = k.split(':');
  b.disabled = true;
  const label = (t) => { b.innerHTML = `<i class="i i-microphone"></i>${t}`; };
  label('procurando…');
  try {
    const r = await fetch(`autodub/${kind}/${id}`, { method: 'POST' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    label(d.queued.length ? 'procurando dublagem' : 'nada sem português');
    b.title = d.queued.length ? 'Quando a dublagem entrar, o português passa a tocar primeiro' : 'Nada sem português aqui';
  } catch (e) {
    label('não deu');
    b.title = e.message;
  }
  b.setAttribute('aria-label', b.title);
}

// o que as fontes têm de cada episódio que falta: "só legendado" e "sem
// fonte" ao lado de "na biblioteca"; a temporada ganha o selo quando ele vale
// para todos os que faltam nela. O servidor avalia em segundo plano (202):
// a página pergunta de novo enquanto a janela está aberta
const AVAIL_TAG = { subbed: '<span class="tag sub">só legendado</span>', nothing: '<span class="tag none">sem fonte</span>' };
async function episodeAvailability(tvdb) {
  const note = (t) => {
    let n = $('#epscheck');
    if (!n) { n = Object.assign(document.createElement('p'), { id: 'epscheck' }); $('#itemeps').prepend(n); }
    n.textContent = t;
    n.hidden = !t;
  };
  for (let i = 0; i < 60 && currentTvdb === tvdb && $('#item').open; i++) {
    let r;
    try { r = await fetch(`series/${tvdb}/availability`); } catch { return; }
    if (r.status === 202) { note('Conferindo as fontes de cada episódio…'); await new Promise((ok) => setTimeout(ok, 4000)); continue; }
    note('');
    if (!r.ok || currentTvdb !== tvdb) return;
    const eps = (await r.json()).episodes || {};
    document.querySelectorAll('#itemeps .ep[data-ep]').forEach((row) => {
      const a = eps[row.dataset.ep];
      if (!a || !AVAIL_TAG[a] || row.hasAttribute('data-have') || row.querySelector('.tag.sub, .tag.none')) return;
      // nenhuma fonte tem: o ⬇ vira 🔔 (pede e fica de olho)
      if (a === 'nothing') row.querySelectorAll('[data-req]').forEach((b) => { b.outerHTML = ICON('', `data-req="${b.dataset.req}"`, 'bell', 'Pedir quando aparecer'); });
      let tags = row.querySelector('.tags');
      if (!tags) {
        tags = Object.assign(document.createElement('span'), { className: 'tags' });
        row.children[1].insertBefore(tags, row.children[1].querySelector('small'));
      }
      tags.insertAdjacentHTML('beforeend', AVAIL_TAG[a]);
    });
    document.querySelectorAll('#itemeps details').forEach((d) => {
      const states = [...d.querySelectorAll('.ep[data-ep]:not([data-have])')].map((row) => eps[row.dataset.ep]).filter(Boolean);
      const all = states.length && states.every((a) => a === states[0]) ? states[0] : null;
      if (all && AVAIL_TAG[all]) d.querySelector('summary .tags').innerHTML = AVAIL_TAG[all];
    });
    return;
  }
  note('');
}

// vitrine por categoria: prontos para assistir + Destaques, Lançamentos e
// Populares no Brasil (TMDB), em carrossel; um toque abre o cartão completo
const CATKEY = 'anubis.categoria';
let currentCat = 'filmes';
try { currentCat = localStorage.getItem(CATKEY) || 'filmes'; } catch {}
function tile(it, ready) {
  const k = keyOf(it);
  if (ready) it.available = true;  // na biblioteca: a janela oferece apagar
  lastResults[k] = it;
  const img = it.poster ? `<img src="${esc(it.poster)}" alt="" loading="lazy">` : '<div class="noposter"></div>';
  const none = !ready && it.avail === 'nothing';
  return `<button class="tile${none ? ' none' : ''}" data-open="${k}">${img}<span class="t">${esc(it.title)}</span><span class="m">${tileMeta(it, ready)}</span></button>`;
}
function tileMeta(it, ready) {
  const badge = ready || it.available ? ' · <span class="ok">pronto</span>' : it.requested ? ' · na lista'
    : it.avail === 'subbed' ? ' · <span class="sub">só legendado</span>'
    : it.avail === 'nothing' ? ' · sem fonte'
    : it.avail === 'unknown' ? ' · a conferir' : '';
  return `${it.year || ''}${badge}`;
}
// o que as fontes têm, contado na aba (cada título uma vez; fora os já pedidos)
const CATNAME = { filmes: 'Filmes', series: 'Séries', animes: 'Animes' };
function eta(s) {
  if (s < 60) return 'menos de 1 min';
  const m = Math.round(s / 60);
  if (m < 60) return `cerca de ${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  return `cerca de ${h} h${r >= 5 ? ` ${r} min` : ''}`;
}
function summary(cat, pending, secs) {
  const seen = new Set(), n = { dubbed: 0, subbed: 0, nothing: 0, unknown: 0 };
  document.querySelectorAll('#showcase .shelf:not(.ready) [data-open]').forEach((t) => {
    const k = t.dataset.open, it = lastResults[k];
    if (seen.has(k) || !it || !it.avail) return;
    seen.add(k);
    n[it.avail]++;
  });
  const parts = [[n.dubbed, 'dublado', 'dublados'], [n.subbed, 'só legendado', 'só legendados'], [n.nothing, 'sem fonte', 'sem fonte'], [n.unknown, 'a conferir', 'a conferir']]
    .filter(([c]) => c).map(([c, one, many]) => `${c} ${c === 1 ? one : many}`);
  const line = parts.length ? `<b>${CATNAME[cat]}:</b> ${parts.join(' · ')}` : '';
  const queue = pending ? `<br>Conferindo as fontes: ${pending} ${pending === 1 ? 'título' : 'títulos'} na fila, ${eta(secs)}. As etiquetas se atualizam sozinhas.` : '';
  return line || queue ? `<p class="msg summary">${line}${queue}</p>` : '';
}
// enquanto há fila, a cada 30 s: etiquetas e resumo da aba aberta, sem reordenar
let availTimer = null;
function watchAvailability(pending) {
  clearTimeout(availTimer);
  if (pending) availTimer = setTimeout(pollAvailability, 30000);
}
async function pollAvailability() {
  const box = $('#showcase');
  if (box.hidden || document.hidden) { watchAvailability(1); return; }
  try {
    const d = await (await fetch('availability')).json();
    box.querySelectorAll('.shelf:not(.ready) [data-open]').forEach((t) => {
      const it = lastResults[t.dataset.open];
      if (!it || !it.avail || !d.states[t.dataset.open]) return;
      it.avail = d.states[t.dataset.open];
      t.classList.toggle('none', it.avail === 'nothing');
      t.querySelector('.m').innerHTML = tileMeta(it, false);
    });
    const old = box.querySelector('.summary');
    const now = summary(currentCat, d.pending, d.eta);
    if (old) old.outerHTML = now || ''; else if (now) box.insertAdjacentHTML('afterbegin', now);
    watchAvailability(d.pending);
  } catch { watchAvailability(1); }
}
const shelf = (title, items, ready) => items.length
  ? `<section class="shelf${ready ? ' ready' : ''}"><h2>${esc(title)}</h2><div class="railbox">
      <button class="nav" data-scroll="-1" aria-label="Voltar"><i class="i i-left"></i></button><button class="nav" data-scroll="1" aria-label="Avançar"><i class="i i-right"></i></button>
      <div class="rail">${items.map((it) => tile(it, ready)).join('')}</div></div></section>` : '';
async function showCategory(cat) {
  currentCat = cat;
  try { localStorage.setItem(CATKEY, cat); } catch {}
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.cat === cat));
  const box = $('#showcase');
  box.innerHTML = '<p class="msg">Carregando…</p>';
  try {
    const r = await fetch(`discover/${cat}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    if (cat !== currentCat) return;  // trocou de aba no meio
    box.innerHTML = shelf('Prontos para assistir', d.ready, true) + d.rows.map((row) => shelf(row.title, row.items, false)).join('')
      + (d.errors.length ? `<p class="msg err">${d.errors.map(esc).join('<br>')}</p>` : '')
      || '<p class="msg">Nada por aqui ainda.</p>';
    // resumo do que as fontes têm, no topo (conta pelos cartões já na página)
    box.insertAdjacentHTML('afterbegin', summary(cat, d.checking, d.checking_eta));
    watchAvailability(d.checking);
    // as outras abas já ficam prontas no servidor (a 1ª vez de séries e animes leva segundos),
    // sem passar na frente da checagem da aba aberta
    if (!prefetched) { prefetched = true; for (const c of ['filmes', 'series', 'animes']) if (c !== cat) fetch(`discover/${c}?bg=1`).catch(() => {}); }
  } catch (e) {
    box.innerHTML = `<p class="msg err">Falhou: ${esc(e.message)}</p>`;
  }
}
let prefetched = false;
$('#tabs').onclick = (e) => {
  const b = e.target.closest('[data-cat]');
  if (!b) return;
  // voltar à vitrine limpa a busca
  $('#q').value = ''; $('#results').hidden = true; $('#showcase').hidden = false;
  showCategory(b.dataset.cat);
};
// "Dublagem não encontrada, instalar legendado?" — sim
async function acceptSubbed(btn, key) {
  const [kind, id] = key.split(':');
  btn.disabled = true; btn.textContent = 'Instalando…';
  const r = await fetch(`${kind}/${id}/subbed`, { method: 'POST' });
  const d = await r.json();
  if (!r.ok) { btn.disabled = false; btn.textContent = 'Instalar legendado'; alert(`Não deu: ${d.error}`); return; }
  const it = tracked[key] || lastResults[key];
  if (it) apply(it, d, false);
}

let openKey = null;
function openItem(k) {
  const it = lastResults[k] || tracked[k];
  if (!it) return;
  if ($('#item').open && openKey === k) return;  // o ▶ da série na própria janela dela
  openKey = k;
  seriesInfo = null;
  currentTvdb = null;
  likeButton();
  $('#itembody').innerHTML = `<div class="grid">${card(it, lastStatus[k])}</div>`;
  $('#itemeps').innerHTML = '';
  if (!$('#item').open) $('#item').showModal();
  if (it.requested || it.available) refresh(it, false);
  if (it.avail === 'unknown') checkNow(k);
  if (it.kind === 'series') loadEpisodes(it);
}
// fechou: para de acompanhar os episódios
// (o evento chega depois: se outra janela já abriu, não é com ela)
$('#item').addEventListener('close', () => { if ($('#item').open) return; currentTvdb = null; seriesInfo = null; $('#itemeps').innerHTML = ''; });
// título ainda não conferido: passa na frente da fila e o cartão mostra o resultado
async function checkNow(k) {
  const [kind, id] = k.split(':');
  try {
    const d = await (await fetch(`availability/${kind}/${id}`, { method: 'POST' })).json();
    const it = lastResults[k];
    if (!it || !d.avail) return;
    it.avail = d.avail;
    it.uncertain = d.avail === 'unknown';
    if (openKey === k && $('#item').open) {
      $('#itembody').innerHTML = `<div class="grid">${card(it, lastStatus[k])}</div>`;
      if (seriesInfo && seriesInfo.k === k) document.querySelectorAll(`#itembody [data-acts="${k}"]`).forEach((el) => { el.outerHTML = seriesActions(it, lastStatus[k]); });
    }
    document.querySelectorAll(`#showcase [data-open="${k}"]`).forEach((t) => {
      t.classList.toggle('none', it.avail === 'nothing');
      t.querySelector('.m').innerHTML = tileMeta(it, false);
    });
  } catch {}
}
$('#itemclose').onclick = () => $('#item').close();
// "não quero ver": sai da vitrine (e o que se parece com ele aparece menos)
// apagar da biblioteca (filme, série ou episódio): mostra o que sai e pede
// confirmação, porque não tem volta. `true` se apagou
async function uninstall(k, ask = 'Apagar da biblioteca?') {
  const [kind, id] = k.split(':');
  const r0 = await fetch(`library/${kind}/${id}`);
  const p = await r0.json();
  if (!r0.ok) throw new Error(p.error);
  const files = p.files > 1 ? ` (${p.files} arquivos)` : '';
  const seeding = p.torrents.length ? `\n\nSai junto do qBittorrent: ${p.torrents.join(', ')}.` : '';
  const kept = p.kept.length ? `\n\nContinua no pacote que semeia (${p.kept.join(', ')}); esse espaço não volta.` : '';
  if (!confirm(`${ask}\n\n${p.title}${files}: libera ${size(p.frees)}.${seeding}${kept}\n\nSai do disco e do Jellyfin e não é baixado de novo. Não dá para desfazer.`)) return false;
  const r = await fetch(`library/${kind}/${id}`, { method: 'DELETE' });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error);
  if (d.errors.length) alert(`Apagado em parte: ${d.errors.join('; ')}`);
  return true;
}
// depois de apagar um filme ou série: some de "Prontos" e o cartão volta a "pedir"
function uninstalled(k) {
  const it = lastResults[k];
  if (it) { it.available = false; it.requested = false; }
  untrack(k);
  showCategory(currentCat);
}

// "gostei": liga e desliga; vira semente do "Para você" (peso de favorito)
const liked = new Set();
fetch('liked').then((r) => r.json()).then((l) => { l.forEach((h) => liked.add(`${h.kind}:${h.id}`)); likeButton(); }).catch(() => {});
function likeButton() {
  const on = liked.has(openKey);
  $('#itemlike').classList.toggle('on', on);
  $('#itemlike').setAttribute('aria-pressed', on);
}
$('#itemlike').onclick = async () => {
  const k = openKey, b = $('#itemlike');
  if (!k) return;
  const [kind, id] = k.split(':');
  const on = !liked.has(k);
  b.disabled = true;
  try {
    const r = await fetch(`liked/${kind}/${id}`, { method: on ? 'POST' : 'DELETE' });
    if (!r.ok) throw new Error((await r.json()).error);
    if (on) liked.add(k); else liked.delete(k);
    likeButton();
  } catch (e) { alert(`Não deu: ${e.message}`); } finally { b.disabled = false; }
};

$('#itemhide').onclick = async () => {
  const k = openKey, b = $('#itemhide');
  if (!k) return;
  const [kind, id] = k.split(':');
  b.disabled = true;
  try {
    const r = await fetch(`hidden/${kind}/${id}`, { method: 'POST' });
    if (!r.ok) throw new Error((await r.json()).error);
    document.querySelectorAll(`#showcase [data-open="${k}"]`).forEach((t) => t.remove());
    liked.delete(k);
    $('#item').close();
    // já baixado: oferece apagar também (cancelar só esconde)
    if (lastResults[k] && lastResults[k].available && (await uninstall(k, 'Também apagar da biblioteca?'))) uninstalled(k);
  } catch (e) { alert(`Não deu: ${e.message}`); } finally { b.disabled = false; }
};

// atualiza o cartão do item onde ele aparecer (pedidos e resultados)
function render(it, st) {
  const k = keyOf(it);
  if (st) lastStatus[k] = st;
  if (tracked[k]) {
    const list = $('#tracked');
    const old = list.querySelector(`[data-key="${k}"]`);
    // pronto sai daqui: aparece em "Prontos para assistir"
    if ((st && st.state === 'available') || (!st && tracked[k].done)) { if (old) old.remove(); }
    else {
      const html = card({ ...it, requested: true }, st);
      if (old) old.outerHTML = html; else list.insertAdjacentHTML('afterbegin', html);
    }
    $('#tracking').hidden = !list.children.length;
  }
  document.querySelectorAll(`#results [data-key="${k}"] .status, #itembody [data-key="${k}"] .status`).forEach((el) => { el.innerHTML = statusHtml(st); });
  if (st && it.kind === 'movie') {
    document.querySelectorAll(`#results [data-key="${k}"], #itembody [data-key="${k}"]`).forEach((c) => setDubTag(c, k, st.state === 'available' && st.portuguese === false));
  }
  if (st) {
    document.querySelectorAll(`#results [data-key="${k}"] [data-acts]`).forEach((el) => { el.outerHTML = cardActions(it, st); });
    document.querySelectorAll(`#itembody [data-key="${k}"] [data-acts]`).forEach((el) => {
      el.outerHTML = seriesInfo && seriesInfo.k === k ? seriesActions(it, st) : cardActions(it, st);
    });
  }
}

// a busca de versões é lenta (vai aos indexadores): uma por item, refeita a cada 15 min
const versionsSeen = {};
async function versions(it) {
  const k = keyOf(it), c = versionsSeen[k];
  if (c && (c.pending || Date.now() - c.at < 15 * 60e3)) return c.v;
  versionsSeen[k] = { pending: true, v: c && c.v };
  try {
    const r = await fetch(`status/${it.kind}/${it.id}/versions`);
    versionsSeen[k] = { at: Date.now(), v: r.ok ? await r.json() : null };
  } catch { versionsSeen[k] = { at: Date.now(), v: null }; }
  return versionsSeen[k].v;
}

// consulta avulsa (resultado de busca, ou sem a conexão ao vivo)
async function refresh(it, openable = true) {
  try {
    const r = await fetch(`status/${it.kind}/${it.id}`);
    const st = await r.json();
    if (!r.ok) return;
    await apply(it, st, openable);
  } catch {}
}

// sai de "Pedidos em andamento" (e da conexão ao vivo)
function untrack(k) {
  if (!tracked[k]) return;
  delete tracked[k];
  const old = $('#tracked').querySelector(`[data-key="${k}"]`);
  if (old) old.remove();
  $('#tracking').hidden = !$('#tracked').children.length;
  save();
}

// aplica um estado (da consulta ou da conexão ao vivo) ao cartão
async function apply(it, st, openable = true) {
  const t = tracked[keyOf(it)];
  // o servidor não tem mais o pedido (apagado aqui, em outro aparelho ou no Radarr/Sonarr)
  if (t && st.state === 'not_requested' && !st.mux) { untrack(keyOf(it)); render(it, st); return; }
  // pedido avulso ainda juntando: não conta como pronto (a dublagem
  // automática é de algo que já está na biblioteca)
  if (st.mux && !st.mux.auto && st.mux.step !== 'done') st.state = 'searching';
  if (st.state === 'searching' && !st.mux) {
    st.versions = await versions(it);
    // filme, série ou anime: há versões com fontes, mas nenhuma dublada
    const v = st.versions;
    if (v && v.approved === 0 && v.dubbed === 0 && v.found - v.no_seeders > 0) st.offerSubbed = `${it.kind}:${it.id}`;
  }
  render(it, st);
  if (t && st.state === 'available' && !t.done) { t.done = Date.now(); save(); }
  // pedido feito nesta página e pronto: abre o Jellyfin (uma vez)
  if (openable && t && t.openWhenReady && st.state === 'available' && st.jellyfin_url) {
    t.openWhenReady = false;
    save();
    location.href = jf(st.jellyfin_url);
  }
}

// estado ao vivo: uma conexão por aba (SSE). O servidor manda o estado de
// cada item ao conectar e depois só o que muda; sem ela (ou enquanto ela
// reconecta), consulta a cada 3 s o que ainda não está pronto.
let stream = null, streamKeys = '', pollTimer = null;
function fallbackPolling(on) {
  if (on && !pollTimer) pollTimer = setInterval(poll, 3000);
  if (!on && pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}
function watchLive() {
  const keys = Object.keys(tracked).filter((k) => k.startsWith('movie:') || k.startsWith('series:')).sort().join(',');
  if (stream && keys === streamKeys) return;
  streamKeys = keys;
  if (stream) { stream.close(); stream = null; }
  if (!keys) return;
  if (!window.EventSource) { fallbackPolling(true); return; }
  stream = new EventSource(`events?items=${encodeURIComponent(keys)}`);
  stream.addEventListener('status', (e) => {
    const d = JSON.parse(e.data);
    const it = tracked[d.key];
    if (it && !d.status.error) apply(it, d.status);
  });
  stream.onopen = () => fallbackPolling(false);
  stream.onerror = () => fallbackPolling(true);
}

// a cada 3 s, só o que ainda não está pronto (cada consulta vai ao Radarr/Sonarr)
function poll() {
  for (const it of Object.values(tracked)) if (!it.done) refresh(it);
}

// pedidos e biblioteca vêm do servidor: a mesma lista em qualquer aparelho e caminho
async function loadRequests() {
  try {
    const r = await fetch('requests');
    if (!r.ok) return;
    const d = await r.json();
    for (const it of [...d.movies, ...d.series]) {
      const k = keyOf(it);
      if (tracked[k]) continue;
      tracked[k] = { ...it, requested: true };
      render(tracked[k], null);
    }
    save();
  } catch {}
}

// remove da lista de pedidos o que já está disponível há um tempo
function prune() {
  for (const [k, t] of Object.entries(tracked)) if (!t.openWhenReady && t.done && Date.now() - t.done > 864e5) delete tracked[k];
  save();
}

let timer;
$('#q').addEventListener('input', (e) => {
  clearTimeout(timer);
  const term = e.target.value.trim();
  $('#results').hidden = term.length < 2;
  $('#showcase').hidden = term.length >= 2;
  if (term.length >= 2) timer = setTimeout(() => search(term), 400);
});
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-req]');
  if (b) {
    if (b.dataset.req.startsWith('episode:')) requestEpisode(b, +b.dataset.req.split(':')[1]);
    else request(b.dataset.req);
  }
  const db = e.target.closest('[data-dub]');
  if (db) dubNow(db, db.dataset.dub);
  const rt = e.target.closest('[data-retest]');
  if (rt) { retestIndexers(rt); return; }
  const sb = e.target.closest('[data-subbed]');
  if (sb) acceptSubbed(sb, sb.dataset.subbed);
  const op = e.target.closest('[data-open]');
  if (op) openItem(op.dataset.open);
  const un = e.target.closest('[data-uninstall]');
  if (un) {
    un.disabled = true;
    const k = un.dataset.uninstall;
    uninstall(k)
      .then((done) => {
        if (!done) return;
        const it = lastResults[openKey] || tracked[openKey];
        if (k.startsWith('episode:')) { if (it) loadEpisodes(it); return; }
        $('#item').close();
        uninstalled(k);
      })
      .catch((err) => alert(`Não deu: ${err.message}`))
      .finally(() => { un.disabled = false; });
    return;
  }
  const w = e.target.closest('[data-watch]');
  if (w) {
    if (w.dataset.guid || w.dataset.keep) { w.disabled = true; w.textContent = 'Abrindo…'; }
    watch(w.dataset.watch, w.dataset.guid, !!w.dataset.keep);
  }
});

prune();
for (const it of Object.values(tracked)) render(it, null);
showCategory(currentCat);
watchLive();
loadRequests();
</script>
