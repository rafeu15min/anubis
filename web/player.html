<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anubis · Player</title>
<style>
  /* sem barras de rolagem: a página e os carrosséis rolam do mesmo jeito */
  * { scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }
  :root { --played: #a855f7; --buf: rgba(250,204,21,.9); --have: rgba(255,255,255,.55); --track: rgba(255,255,255,.18); --text: #f2f2f2; --muted: rgba(255,255,255,.7); }
  * { box-sizing: border-box; }
  /* toque: os gestos do player (arrastar, segurar, pinça) no lugar de rolar e dar zoom na página */
  html, body { margin: 0; height: 100%; background: #000; color: var(--text); font: 15px/1.4 system-ui, sans-serif; overflow: hidden; touch-action: none; -webkit-touch-callout: none; user-select: none; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  .osd { position: fixed; left: 0; right: 0; transition: opacity .25s; }
  .hidden .osd, .hidden .panel { opacity: 0; pointer-events: none; }
  .hidden { cursor: none; }
  .top { top: 0; display: flex; align-items: center; gap: 12px; padding: 16px 20px 40px; background: linear-gradient(rgba(0,0,0,.75), transparent); }
  .top h1 { margin: 0; font-size: 18px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top small { color: var(--muted); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bottom { bottom: 0; padding: 40px 20px 14px; background: linear-gradient(transparent, rgba(0,0,0,.85)); }
  .timeline { display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; font-size: 14px; }
  .bar { position: relative; flex: 1; height: 22px; cursor: pointer; touch-action: none; }
  .bar .rail, .bar .have, .bar .buf, .bar .played { position: absolute; left: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; transition: height .12s, margin .12s; }
  .bar .rail { right: 0; background: var(--track); }
  .bar .have { background: var(--have); }
  .bar .buf { background: var(--buf); }
  .bar .played { background: var(--played); }
  .bar .knob { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--played); transform: scale(0); transition: transform .12s; }
  .bar:hover .rail, .bar:hover .have, .bar:hover .buf, .bar:hover .played, .bar.drag .rail, .bar.drag .have, .bar.drag .buf, .bar.drag .played { height: 6px; margin-top: -3px; }
  .bar:hover .knob, .bar.drag .knob { transform: scale(1); }
  .bar .tip { position: absolute; bottom: 24px; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,.8); font-size: 12px; transform: translateX(-50%); display: none; white-space: nowrap; }
  .bar:hover .tip { display: block; }
  .controls { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
  .controls .spacer { flex: 1; }
  button { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; color: var(--text); cursor: pointer; }
  button:hover { background: rgba(255,255,255,.12); }
  button svg { width: 26px; height: 26px; fill: currentColor; }
  button.big svg { width: 34px; height: 34px; }
  input[type=range] { width: 100px; accent-color: var(--text); }
  .panel { position: fixed; top: 68px; right: 20px; max-width: min(360px, calc(100vw - 40px)); padding: 10px 14px; border-radius: 10px; background: rgba(20,20,20,.75); font-size: 13px; transition: opacity .25s; }
  .panel a { color: #7fd0ff; }
  #cc.on { color: var(--played); }
  /* o menu rola sozinho e não herda o touch-action do body: sem isto, toques
     rápidos (atraso +0,1 três vezes) viram toque duplo e o segundo se perde */
  .menu, button { touch-action: manipulation; }
  .menu { position: fixed; right: 20px; bottom: 90px; width: min(330px, calc(100vw - 24px)); max-height: 62vh; overflow: auto; padding: 6px; border-radius: 10px; background: rgba(20,20,20,.98); z-index: 5; }
  .menu button { display: flex; justify-content: space-between; gap: 10px; width: 100%; height: auto; min-height: 42px; padding: 8px 12px; border-radius: 6px; text-align: left; font: inherit; }
  .menu button.sel { color: var(--played); font-weight: 600; }
  .menu .val { color: var(--muted); font-size: 13px; text-align: right; }
  .menu small { display: block; padding: 6px 12px; color: var(--muted); }
  .menu h3 { margin: 10px 12px 4px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .menu .row { display: flex; align-items: center; gap: 4px; padding: 0 4px; }
  .menu .row button { flex: 1; justify-content: center; text-align: center; min-height: 38px; padding: 6px; }
  .menu .row .mid { flex: 1.6; }
  video::cue { background: rgba(0,0,0,.65); color: #fff; font-size: clamp(16px, 2.6vw, 30px); line-height: 1.3; }
  button.next { position: fixed; right: 20px; bottom: 120px; width: auto; height: auto; padding: 10px 16px; border-radius: 8px; background: rgba(20,20,20,.85); font: inherit; border: 1px solid rgba(255,255,255,.25); transition: opacity .25s; }
  .hidden button.next { opacity: 0; pointer-events: none; }
  .center { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .spin { width: 56px; height: 56px; border: 4px solid rgba(255,255,255,.2); border-top-color: var(--played); border-radius: 50%; animation: r 1s linear infinite; display: none; }
  .waiting .spin { display: block; }
  @keyframes r { to { transform: rotate(360deg); } }
  /* total somado dos toques duplos, do lado tocado */
  .hint { position: fixed; top: 50%; transform: translateY(-50%); padding: 10px 18px; border-radius: 24px; background: rgba(0,0,0,.55); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .hint.l { left: 10%; opacity: 1; }
  .hint.r { right: 10%; opacity: 1; }
  /* c: em cima (2× enquanto segura); m: no meio (arrasto, volume, atalhos) */
  .hint.c { left: 50%; top: 14%; transform: translateX(-50%); opacity: 1; }
  .hint.m { left: 50%; transform: translate(-50%, -50%); opacity: 1; }
  /* tela bloqueada: só o cadeado, que aparece num toque. Embaixo: no alto,
     no centro, o Vivaldi põe o botão de imagem na imagem por cima do vídeo */
  .unlock { display: none; position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.55); z-index: 7; transition: opacity .25s; }
  .locked .unlock { display: inline-flex; }
  .locked.hidden .unlock { opacity: 0; pointer-events: none; }
  .locked .osd, .locked .panel, .locked .menu, .locked button.next, .locked .slow { display: none !important; }
  @media (hover: hover) and (pointer: fine) { #lock { display: none; } }
  .msg { max-width: 520px; margin: 0 20px; padding: 18px 20px; border-radius: 12px; background: rgba(20,20,20,.9); text-align: center; pointer-events: auto; display: none; }
  .msg.on { display: block; }
  .slow { position: fixed; left: 50%; top: 80px; transform: translateX(-50%); width: min(520px, calc(100vw - 32px)); padding: 14px 16px; border-radius: 12px; background: rgba(20,20,20,.94); z-index: 6; font-size: 14px; }
  .slow p { margin: 0 0 10px; }
  .slow button { width: 100%; height: auto; min-height: 44px; margin-top: 6px; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); text-align: left; font: inherit; }
  .slow small { color: var(--muted); }
  @media (max-width: 600px) { #vol, .desk { display: none; } .bottom { padding: 30px 10px 8px; } .menu { right: 12px; bottom: 80px; } }
</style>
<style id="cuestyle"></style>
</head>
<body class="waiting">
<video id="v" playsinline preload="auto"></video>

<div class="osd top">
  <button id="back" title="Voltar à busca"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>
  <div style="min-width:0;flex:1"><h1 id="title">…</h1><small id="release"></small></div>
  <button id="lock" title="Bloquear a tela (só o cadeado responde)"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3.1-9H8.9V6a3.1 3.1 0 0 1 6.2 0v2z"/></svg></button>
</div>
<button class="unlock" id="unlock" title="Desbloquear"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3.1-9H8.9V6a3.1 3.1 0 0 1 6.2 0v2z"/></svg></button>

<div class="panel" id="panel">Preparando…</div>
<div class="menu" id="menu" hidden></div>
<button class="next" id="next" hidden></button>
<div class="slow" id="slow" hidden></div>

<div class="hint" id="hint"></div>
<div class="center"><div class="spin"></div><div class="msg" id="msg"></div></div>

<div class="osd bottom">
  <div class="timeline">
    <span id="cur">0:00</span>
    <div class="bar" id="bar">
      <div class="rail"></div>
      <div id="have"></div>
      <div id="buf"></div>
      <div class="played" id="played"></div>
      <div class="knob" id="knob"></div>
      <div class="tip" id="tip">0:00</div>
    </div>
    <span id="rem">-0:00</span>
  </div>
  <div class="controls">
    <button id="rew" title="Voltar 10 s (←)"><svg viewBox="0 0 24 24"><path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="12" y="16" font-size="6.5" text-anchor="middle" font-family="sans-serif">10</text></svg></button>
    <button id="play" class="big" title="Play/pausa (espaço)"><svg viewBox="0 0 24 24"><path id="playicon" d="M8 5v14l11-7z"/></svg></button>
    <button id="fwd" title="Avançar 10 s (→)"><svg viewBox="0 0 24 24"><path d="M12.01 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="12" y="16" font-size="6.5" text-anchor="middle" font-family="sans-serif">10</text></svg></button>
    <span class="spacer"></span>
    <button id="cc" title="Legendas (C)"><svg viewBox="0 0 24 24"><path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1z"/></svg></button>
    <button id="gear" title="Qualidade, áudio, legendas e velocidade"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54a7.4 7.4 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg></button>
    <button id="mute" title="Som (M)"><svg viewBox="0 0 24 24"><path id="volicon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
    <input id="vol" type="range" min="0" max="1" step="0.05" value="1" title="Volume">
    <button id="pip" class="desk" title="Imagem na imagem"><svg viewBox="0 0 24 24"><path d="M19 7h-8v6h8V7zm2-4H3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H3V5h18v14z"/></svg></button>
    <button id="full" title="Tela cheia (F)"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const v = $('v');
const base = location.pathname.replace(/\/$/, '');
const RESUME = `anubis.pos.${base}`;
const PLAY = 'M8 5v14l11-7z', PAUSE = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';
const MUTED = 'M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.5 2.4v-.6zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A8.8 8.8 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1a7 7 0 0 1 5 6.7zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.2c-.7.5-1.4.9-2.3 1.2v2.1a9 9 0 0 0 3.7-1.8l2 2 1.3-1.3-9-9L4.3 3zM12 4 9.9 6.1 12 8.2V4z';
const LOUD = $('volicon').getAttribute('d');

// o Jellyfin pelo mesmo caminho (cabo, rede local, Tailscale) desta página
const jf = (u) => { try { const x = new URL(u); x.hostname = location.hostname; return x.href; } catch { return u; } };

const fmt = (s) => {
  if (!isFinite(s) || s < 0) s = 0;
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = Math.floor(s % 60);
  return (h ? `${h}:${String(m).padStart(2, '0')}` : m) + ':' + String(x).padStart(2, '0');
};

// ---- tempo: direto, o <video> sabe tudo; convertido (ffmpeg), o vídeo
// começa em `offset` e a duração vem do ffprobe
let converted = false, offset = 0, duration = 0;
// posição pedida enquanto o stream novo ainda não começou
let target = null, seekTimer;
const now = () => target ?? offset + (v.currentTime || 0);
const total = () => (converted ? duration : v.duration || duration || 0);
// a tela mostra a posição nova na hora (o <video> só avisa quando o stream
// novo começa). `wait`: toques seguidos em voltar/avançar se somam e só a
// posição final abre um stream, já que cada um é um ffmpeg novo
function seek(t, wait = 0) {
  t = Math.max(0, Math.min(total() - 1, t));
  paint(t);
  if (!converted) { v.currentTime = t; return; }
  target = t;
  document.body.classList.add('waiting');
  clearTimeout(seekTimer);
  seekTimer = setTimeout(() => {
    target = null;
    offset = t;
    setSrc(streamUrl(t));
    v.play().catch(() => {});
    if (typeof applySub === 'function') applySub();
  }, wait);
}

// ---- formato e escolhas do menu. M: o que o ffprobe viu (altura, faixas de
// áudio). Faixa de áudio que não é a primeira, qualidade abaixo da do
// arquivo ou dublagem corrigida obrigam a converter mesmo um vídeo que o
// navegador tocaria direto
let M = {}, T = 720;  // T: altura do convertido sem escolha (padrão do servidor)
let aud = 0, quality = 'auto', autoH = null, forceConv = false;
const store = (k, x) => { try { localStorage.setItem(k, String(x)); } catch {} };
const stored = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const QKEY = 'anubis.qualidade', AKEY = 'anubis.audio', RKEY = 'anubis.velocidade';
const effH = () => (quality === 'auto' ? autoH : quality);
const needsConvert = () => (!!M.mode && M.mode !== 'direct') || forceConv || aud > 0 || (!!effH() && !!M.height && effH() < M.height);
const streamUrl = (t) => `${base}/stream.mp4?t=${t.toFixed(1)}` + (aud ? `&a=${aud}` : '') + (effH() ? `&h=${effH()}` : '');
// abre o vídeo em `t`: direto (o <video> busca sozinho) ou convertido a partir de `t`
function openAt(t) {
  converted = needsConvert();
  if (converted) { offset = t; setSrc(streamUrl(t)); }
  else {
    offset = 0;
    setSrc(`${base}/video`);
    if (t) v.addEventListener('loadedmetadata', () => { v.currentTime = t; }, { once: true });
  }
  v.play().catch(() => {});
}
// troca de qualidade/áudio/dublagem: continua do ponto atual
function reopen() {
  const t = now();
  target = null;
  clearTimeout(seekTimer);
  document.body.classList.add('waiting');
  openAt(t);
  applySub();
  if (!$('menu').hidden) renderMenu();
}

// onde a pessoa parou no Jellyfin (qualquer aparelho, ou o próprio Jellyfin)
const savedAt = fetch(`${base}/progress`).then((r) => (r.ok ? r.json() : null)).then((d) => d && d.t).catch(() => null);

async function start(media) {
  M = media || {};
  duration = M.duration || 0;
  const q = stored(QKEY);
  if (q && q !== 'auto' && M.height) quality = Math.min(+q, M.height);
  const a = (M.audios || []).findIndex((x) => x.lang && x.lang === stored(AKEY));
  if (a > 0) aud = a;
  const r = +stored(RKEY);
  if (r) v.defaultPlaybackRate = v.playbackRate = r;
  let pos = 0;
  try { const p = parseFloat(localStorage.getItem(RESUME)); if (p > 5) pos = p; } catch {}
  // vale o do Jellyfin; o deste aparelho só se estiver perto (é salvo mais
  // vezes, então é mais exato) ou se o Jellyfin não souber
  const jf = await Promise.race([savedAt, new Promise((ok) => setTimeout(() => ok(null), 2500))]);
  if (jf > 5 && !(pos && Math.abs(pos - jf) < 30)) pos = jf;
  openAt(pos);
}

// ---- dublagem: se o Anubis mede um atraso com o vídeo já tocando, recomeça
// o stream na posição atual (o ffmpeg passa a corrigir a dublagem)
const dubSecs = (d) => (d && d.state === 'offset' ? d.seconds : 0);
let dubApplied = null;
function syncDub(dub) {
  const s = dubSecs(dub);
  if (dubApplied === null) { dubApplied = s; return; }
  if (s === dubApplied) return;
  dubApplied = s;
  forceConv = true;
  reopen();
}

v.addEventListener('waiting', () => document.body.classList.add('waiting'));
v.addEventListener('playing', () => document.body.classList.remove('waiting'));
v.addEventListener('canplay', () => document.body.classList.remove('waiting'));
v.addEventListener('play', () => $('playicon').setAttribute('d', PAUSE));
v.addEventListener('pause', () => $('playicon').setAttribute('d', PLAY));
v.addEventListener('error', () => {
  if (!v.src) return;
  document.body.classList.remove('waiting');
  const m = $('msg');
  m.innerHTML = 'Este arquivo não tocou no navegador. O download continua; quando terminar, ele abre no Jellyfin.';
  m.classList.add('on');
});
let saved = 0;
v.addEventListener('timeupdate', () => {
  paint();
  paintBuf();
  if (Math.abs(now() - saved) > 5) { saved = now(); try { localStorage.setItem(RESUME, String(saved)); } catch {} }
});
// ---- progresso no Jellyfin: o player avisa onde está (a cada 15 s tocando,
// ao pausar, ao sair da aba e no fim); o Anubis grava para o usuário dele
let reportedAt = 0;
function report(beacon = false, t = now()) {
  const d = total();
  if (!started || !d) return;
  reportedAt = performance.now();
  const body = JSON.stringify({ t, duration: d });
  // saindo da página, só o sendBeacon garante a entrega
  if (beacon) navigator.sendBeacon(`${base}/progress`, new Blob([body], { type: 'application/json' }));
  else fetch(`${base}/progress`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body }).catch(() => {});
}
v.addEventListener('timeupdate', () => { if (!v.paused && target === null && performance.now() - reportedAt > 15000) report(); });
v.addEventListener('pause', () => { if (target === null && !v.ended) report(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) report(true); });
window.addEventListener('pagehide', () => report(true));

v.addEventListener('ended', () => {
  report(true, total());
  try { localStorage.removeItem(RESUME); } catch {}
  if (next) goNext();
});

// ---- barra: branca = já no disco, amarela = carregado no player, roxa = assistido
const bar = $('bar');
let have = [];
let dragTo = null;  // destino de um arrasto na tela, enquanto o dedo está nela
function paint(t = dragTo ?? now()) {
  const d = total();
  const f = d ? t / d : 0;
  $('played').style.width = `${f * 100}%`;
  $('knob').style.left = `${f * 100}%`;
  $('cur').textContent = fmt(t);
  $('rem').textContent = '-' + fmt(d - t);
}
// o que o <video> já tem carregado (no convertido, contado a partir de `offset`)
let bufHtml = '';
function paintBuf() {
  const d = total(), b = v.buffered, from = converted ? offset : 0;
  let html = '';
  if (d && target === null) for (let i = 0; i < b.length; i++) {
    const a = (from + b.start(i)) / d, z = Math.min(1, (from + b.end(i)) / d);
    html += `<div class="buf" style="left:${a * 100}%;width:${(z - a) * 100}%"></div>`;
  }
  if (html !== bufHtml) $('buf').innerHTML = bufHtml = html;
}
v.addEventListener('progress', paintBuf);

// ---- qualidade automática: se o vídeo trava sem o download ser o motivo
// (o trecho à frente já está no disco), a conversão ou a conexão não dá
// conta: desce um degrau (720p → 480p → 360p) e reabre no ponto atual. Conta
// como travada uma espera de mais de 2,5 s ou 3 esperas em 1 minuto, fora os
// primeiros 5 s depois de abrir o vídeo
let srcAt = 0, stallAt = 0, stalls = [], phase = null;
function setSrc(u) { srcAt = performance.now(); stallAt = 0; v.src = u; }
v.addEventListener('waiting', () => { if (!v.paused && performance.now() - srcAt > 5000) stallAt = performance.now(); });
v.addEventListener('playing', () => {
  if (!stallAt) return;
  const t = performance.now(), long = t - stallAt > 2500;
  stallAt = 0;
  stalls = stalls.filter((x) => t - x < 60000);
  stalls.push(t);
  if (long || stalls.length >= 3) degrade();
});
// travada sem voltar a tocar (chamada a cada 2 s)
function stuck() { if (stallAt && performance.now() - stallAt > 5000) { stallAt = 0; degrade(); } }
function degrade() {
  if (quality !== 'auto' || !M.height) return;
  if (phase !== 'done' && aheadSecs() < 30) return;  // é o download: o aviso de versão mais leve cuida
  const next = [720, 480, 360].find((h) => h < curHeight());
  if (!next) return;
  autoH = next;
  stalls = [];
  reopen();
}

// ---- o download acompanha o vídeo? Se ficar ~30 s abaixo do que o vídeo
// consome, com pouco já baixado à frente, oferece uma versão mais leve
const [, , KIND, ID] = base.split('/');
let slowFor = 0, slowOffered = false;
const mb = (b) => (b >= 2 ** 30 ? `${(b / 2 ** 30).toFixed(1)} GB` : `${Math.round(b / 2 ** 20)} MB`);
function aheadSecs(d) {
  const dur = total();
  if (!dur) return Infinity;
  const f = now() / dur;
  const r = have.find(([a, b]) => a <= f + 1e-6 && f < b);
  return r ? (r[1] - f) * dur : 0;
}
function checkPace(d) {
  const dur = total();
  if (slowOffered || d.phase !== 'downloading' || !d.size || !dur || d.speed_mbps == null) { slowFor = 0; return; }
  const need = d.size / dur / 2 ** 20;  // MB/s que o vídeo consome
  if (d.speed_mbps < need && aheadSecs(d) < 60) slowFor += 2; else slowFor = 0;
  if (slowFor >= 30) { slowOffered = true; offerLighter(d, need); }
}
async function offerLighter(d, need) {
  const box = $('slow');
  const head = `<p>O download não está acompanhando esta versão: chega ${d.speed_mbps.toFixed(1)} MB/s e o vídeo precisa de ${need.toFixed(1)} MB/s. Vai travar à frente.</p>`;
  box.innerHTML = head + '<small>Procurando uma versão mais leve…</small>';
  box.hidden = false;
  let list = [];
  try { const r = await fetch(`${base}/lighter`); if (r.ok) list = await r.json(); } catch {}
  box.innerHTML = head + (list.length
    ? list.map((c) => `<button data-guid="${c.guid.replace(/"/g, '&quot;')}">Trocar por ${c.quality} · ${mb(c.size)} · ${c.seeders} fontes<br><small>${c.title.replace(/</g, '&lt;')}</small></button>`).join('')
    : '<small>Nenhuma versão mais leve com fontes suficientes agora.</small>')
    + '<button data-keep>Continuar com esta</button>';
}
// ---- tocando da biblioteca em WEB: se há Bluray com fontes, oferece a troca
// (a busca leva um tempo; o vídeo já está tocando)
async function offerBetter() {
  let list = [];
  try { const r = await fetch(`${base}/better`); if (r.ok) list = await r.json(); } catch {}
  if (!list.length || !$('slow').hidden) return;
  $('slow').innerHTML = `<p>Há uma versão melhor desta, mais acima na sua fila de qualidade (${list[0].quality.replace('-', ' ')}). A troca baixa a nova (dá para continuar assistindo enquanto baixa) e ela substitui a atual na biblioteca.</p>`
    + list.slice(0, 3).map((c) => `<button data-guid="${c.guid.replace(/"/g, '&quot;')}">Trocar por ${c.quality} · ${mb(c.size)} · ${c.seeders} fontes<br><small>${c.title.replace(/</g, '&lt;')}</small></button>`).join('')
    + '<button data-keep>Continuar com esta</button>';
  $('slow').hidden = false;
}

$('slow').onclick = async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.hasAttribute('data-keep')) { $('slow').hidden = true; return; }
  b.disabled = true; b.textContent = 'Trocando…';
  // a posição fica salva: a nova versão continua do mesmo ponto
  try { localStorage.setItem(RESUME, String(now())); } catch {}
  const r = await fetch('/watch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: KIND, id: +ID, guid: b.dataset.guid }) });
  const res = await r.json();
  if (r.ok) location.href = '/' + res.player; else { b.textContent = `Não deu: ${res.error || 'versão recusada'}`; }
};

// ---- andamento do download (e o formato, para começar a tocar)
const PHASE = { downloading: 'Baixando', importing: 'Entrando na biblioteca…', done: 'Na biblioteca', failed: 'Falhou' };
const MODE = { remux: ' · adaptando o formato', transcode: ' · convertendo o vídeo' };
let started = false, waitedMedia = 0;
async function info() {
  try {
    const r = await fetch(`${base}/info`);
    const d = await r.json();
    if (!r.ok) { $('panel').textContent = d.error || 'Nada sendo assistido aqui.'; return; }
    $('title').textContent = d.title; document.title = `${d.title} · Anubis`;
    $('release').textContent = d.release;
    have = d.have || []; paintHave();
    // começa quando o formato é conhecido (ou depois de ~20 s sem ffprobe)
    if (d.transcode_height) T = d.transcode_height;
    phase = d.phase;
    // começa quando o formato é conhecido. O servidor sempre responde (o
    // ffprobe tem 2 min; sem ele, "toca direto"): só sem resposta nenhuma em
    // ~130 s o player arrisca tocar o arquivo como está
    if (!started && (d.media || ++waitedMedia > 65)) { started = true; start(d.media); if (d.phase === 'done') offerBetter(); }
    // começou sem o formato e ele chegou: se o navegador não toca o arquivo
    // como está (ex. áudio E-AC3 no Android: a imagem vai e o som não),
    // passa para o convertido no ponto atual
    else if (started && d.media && !M.mode) {
      M = d.media;
      if (needsConvert()) reopen();
    }
    if (started) syncDub(d.dub);
    if (d.media && d.media.duration) duration = d.media.duration;
    if (d.next && !next) { next = d.next; $('next').textContent = `Próximo: ${d.next[1]} ▶`; $('next').hidden = false; }
    let t = PHASE[d.phase] || d.phase;
    if (d.phase === 'downloading') {
      t += ` ${Math.round(d.progress * 100)}%`;
      if (d.speed_mbps != null) t += ` · ${d.speed_mbps.toFixed(1)} MB/s`;
      if (d.peers != null) t += ` · ${d.peers} fontes`;
    }
    checkPace(d);
    stuck();
    if (d.media && MODE[d.media.mode]) t += MODE[d.media.mode];
    if (d.dub && d.dub.state === 'checking') t += ' · conferindo a sincronia da dublagem';
    if (d.dub && d.dub.state === 'offset') t += ` · dublagem ressincronizada (${Math.abs(d.dub.seconds).toFixed(1).replace('.', ',')} s)`;
    if (autoH) t += ` · qualidade automática em ${autoH}p (o vídeo travava)`;
    if (d.error) t += ` — ${d.error}`;
    $('panel').innerHTML = t + (d.jellyfin_url ? ` · <a href="${jf(d.jellyfin_url)}">Abrir no Jellyfin</a>` : '');
    const m = $('msg');
    if (m.classList.contains('on') && d.jellyfin_url && !m.querySelector('a')) m.innerHTML += `<p><a href="${jf(d.jellyfin_url)}">Abrir no Jellyfin</a></p>`;
  } catch {}
}
info();
setInterval(info, 2000);
</script>
